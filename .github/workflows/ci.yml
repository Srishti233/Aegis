name: ci
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install ruff==0.8.6
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: {POSTGRES_USER: aegis, POSTGRES_PASSWORD: aegis, POSTGRES_DB: aegis_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aegis" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AEGIS_TEST_DATABASE_URL: postgresql+psycopg://aegis:aegis@localhost:5432/aegis_test
      AEGIS_TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-dev.txt
      - name: unit + API + integration tests with coverage gate
        run: pytest --cov=app --cov=mock_llm --cov-fail-under=80 -p no:logging

  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-dev.txt
      - name: datasets are reproducible
        run: python eval/build_datasets.py && git diff --exit-code eval/attacks.jsonl eval/benign.jsonl
      - name: held-out detection / false-positive gate (eval/thresholds.json)
        run: python eval/run_eval.py --check
      - uses: actions/upload-artifact@v4
        with: {name: eval-results, path: "eval/results.*"}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compose stack comes up and the demo succeeds
        run: |
          docker compose up --build -d --wait
          SKIP_STACK=1 bash scripts/demo.sh
      - name: show service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: tear down
        if: always()
        run: docker compose down -v
